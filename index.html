<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guitar Songs">
<meta name="theme-color" content="#2f3e28">
<title>Guitar Songs Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Avenir Next','Segoe UI',system-ui,sans-serif;
    background: #e9ddc0; height: 100vh; display: flex; overflow: hidden;
  }
  aside {
    width: 189px; flex-shrink: 0; padding: 11px 9px 14px;
    display: flex; flex-direction: column; gap: 11px;
    border-right: 3px solid #1f2d1a; background: #2f3e28;
    height: 100vh; overflow-y: auto;
  }
  .brand-title { font-size: 14.5px; font-weight: 800; color: #f5efdc; cursor: pointer; }
  .brand-title:hover { text-decoration: underline; }
  .brand-sub { font-size: 10px; color: #c9d3b8; }
  .box {
    background: #fdf9ee; border: 2px solid #1f2d1a; border-radius: 9px;
    padding: 8px 8px 9px; box-shadow: 0 3px 8px rgba(0,0,0,.25);
  }
  .box-title {
    font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: #3a7d44; font-weight: 800; margin-bottom: 5px;
  }
  .chip {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 4px 7px; margin-bottom: 4px; border-radius: 6px;
    border: 1.5px solid #ddd6c8; background: #faf8f2; color: #9a927f;
    font-weight: 500; font-size: 10.5px; cursor: pointer; transition: all .15s;
    font-family: inherit; text-align: left;
  }
  .chip.on { border-color: #1f2d1a; background: #3a7d44; color: #ffffff; font-weight: 700; }
  .chip .cnt { font-size: 9px; opacity: .75; }
  .chip.pair.on.p-CAm { border-color:#0f6b38; background:#17a054; color:#ffffff; }
  .chip.pair.on.p-DBm { border-color:#9a6a00; background:#e09b00; color:#ffffff; }
  .chip.pair.on.p-EmG { border-color:#134d80; background:#1e78c2; color:#ffffff; }
  .chip.pair.on.p-FDm { border-color:#8c1f42; background:#d13563; color:#ffffff; }
  .chip.add-song { border-color: #3a7d44; background: #3a7d44; color: #fff; font-weight: 700; justify-content: center; }
  .box-row { display: flex; gap: 5px; }
  .chip.half { flex: 1; padding: 4px 3px; font-size: 9px; text-align: center; }
  .chip.half span { width: 100%; text-align: center; }
  #dayChips { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #dayChips .chip { margin-bottom: 0; }
  .mini-row { display: flex; gap: 5px; margin-top: 4px; }
  .mini {
    flex: 1; padding: 3px 0; font-size: 9px; font-weight: 700;
    border: 1px solid #d8d2c4; border-radius: 6px; background: #fff;
    color: #5c564a; cursor: pointer; font-family: inherit;
  }
  .hint { font-size: 8.5px; color: #7a7263; margin-top: 3px; line-height: 1.3; }
  main { flex: 1; padding: 20px; height: 100vh; overflow-y: auto; overflow-x: auto; }
  #searchBar {
    margin-bottom: 14px; max-width: 420px;
    position: sticky; top: 0; z-index: 10; background: #e9ddc0; padding: 4px 0 10px;
  }
  #searchInput {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    border: 2px solid #1f2d1a; font-size: 13.5px; font-family: inherit;
    font-style: italic; color: #8a7860; background: #fffdf5; box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  #searchInput::placeholder { color: #8a7860; font-style: italic; opacity: .65; }
  #searchInput:focus { outline: none; border-color: #3a7d44; box-shadow: 0 0 0 3px rgba(58,125,68,.25); }
  #board { display: flex; flex-direction: column; gap: 14px; }
  #board.tb { max-width: 760px; }

  /* Day band (both modes share the card shell) */
  .day-card { background: #fffdf5; border: 2px solid #1f2d1a; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
  .day-head { padding: 10px 14px; background: linear-gradient(90deg,#2f3e28,#3a7d44); color: #f7f2e0; }
  .day-head.fun { background: linear-gradient(90deg,#4a2c14,#b3541e); }
  .day-name { font-weight: 800; font-size: 15px; }
  .day-sub { font-size: 11px; opacity: .85; }
  .day-body { padding: 8px; }

  .line { display: flex; align-items: stretch; gap: 0; }
  .line-songs { flex: 1; display: flex; flex-wrap: wrap; padding: 4px 0; }
  .cell {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px; margin: 2px; border-radius: 6px;
    background: #f7f4ec; border: 1px solid #e6e0d2;
    font-size: 12px; color: #2b2822; cursor: pointer; transition: all .12s;
  }
  .cell:hover { border-color: #3a7d44; box-shadow: 0 0 0 2px rgba(58,125,68,.18); }
  .cell.dim { opacity: .22; }

  .song { display: grid; grid-template-columns: 1fr 52px 40px; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; transition: all .12s; }
  .song:nth-child(odd) { background: #f7f4ec; }
  .song:hover { box-shadow: inset 0 0 0 2px rgba(58,125,68,.35); }
  .song .name { font-size: 12.5px; color: #2b2822; line-height: 1.35; }
  .song .chord-col, .song .gender-col { display: flex; justify-content: center; }

  .badge {
    font-size: 11px; font-weight: 800; min-width: 30px; text-align: center;
    padding: 2px 6px; border-radius: 5px; color: #6b6555; background: #eee9dc;
  }
  .badge.p-CAm { color:#fff; background:#17a054; }
  .badge.p-DBm { color:#fff; background:#e09b00; }
  .badge.p-EmG { color:#fff; background:#1e78c2; }
  .badge.p-FDm { color:#fff; background:#d13563; }
  .empty { font-size: 12px; color: #9a927f; padding: 8px; }
  .gender-mark {
    font-size: 13px; font-weight: 900; margin-left: 3px;
    padding: 2px 7px; border-radius: 5px; display: inline-block; line-height: 1.3;
  }
  .gender-mark.male { color: #fff; background: #16213e; }
  .gender-mark.female { color: #fff; background: #8e24aa; }
  .gender-row { grid-template-columns: 1fr 1fr; margin-top: 2px; }
  .no-days { color: #7a7263; font-size: 14px; padding: 40px; }

  /* Blurred guitar watermark */
  #watermark {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #watermark svg {
    width: 78vmin; height: 78vmin; opacity: .13;
    filter: blur(5px); transform: rotate(-18deg);
  }
  aside, main { position: relative; z-index: 1; }
  @media (max-width: 700px) {
    body { flex-direction: column; height: auto; overflow: visible; }
    aside { width: 100%; height: auto; max-height: 40vh; }
    main { height: auto; overflow: visible; }
  }

  /* Random-pick modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(20,16,8,.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-card {
    background: #fdf9ee; border: 3px solid #1f2d1a; border-radius: 16px;
    padding: 26px 24px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 12px 34px rgba(0,0,0,.4);
  }
  .modal-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .arrow-btn {
    background: transparent; border: none; cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 15px; color: #d21818; letter-spacing: .02em;
  }
  .arrow-btn:disabled { opacity: .25; cursor: default; }
  .modal-eyebrow {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: #3a7d44; font-weight: 800; margin-bottom: 12px;
  }
  .modal-badge-wrap { margin-bottom: 10px; }
  .modal-badge-wrap .badge { font-size: 15px; padding: 5px 14px; }
  .modal-song { font-size: 19px; font-weight: 800; color: #2b2822; line-height: 1.35; margin-bottom: 8px; }
  .modal-meta { font-size: 12.5px; color: #7a7263; margin-bottom: 18px; }
  .modal-buttons { display: flex; flex-direction: column; gap: 8px; }
  .modal-btn {
    padding: 11px 14px; border-radius: 9px; border: 2px solid #1f2d1a;
    font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .modal-btn.primary { background: #3a7d44; color: #fff; }
  .modal-btn.secondary { background: #fff; color: #2b2822; }
  .modal-btn.ghost { background: transparent; border-color: #d8d2c4; color: #7a7263; }
  .modal-btn.danger { background: #b3302c; color: #fff; border-color: #7a1f1c; }

  /* Pinned pick banner above board */
  .pick-banner {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #fdf3d9; border: 2px solid #b3541e; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 12.5px; color: #4a2c14; font-weight: 700;
  }
  .pick-banner button {
    margin-left: auto; border: none; background: transparent; color: #b3541e;
    font-weight: 800; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .cell.picked, .song.picked {
    outline: 3px solid #b3541e; outline-offset: 1px;
    animation: pulseGlow 1.4s ease-in-out 2;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(179,84,30,0); }
    50% { box-shadow: 0 0 14px rgba(179,84,30,.7); }
  }

  /* Add / edit song form */
  .text-input {
    width: 100%; padding: 9px 10px; margin-bottom: 10px; border-radius: 8px;
    border: 2px solid #d8d2c4; font-size: 13px; font-family: inherit; color: #2b2822;
    background: #fff;
  }
  .text-input:focus { outline: none; border-color: #3a7d44; }
  .form-label { display: block; text-align: left; font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .06em; color: #7a7263; margin: 8px 0 5px; }
  .form-error { color: #b3302c; font-size: 12px; font-weight: 700; margin: 4px 0 10px; min-height: 14px; text-align: left; }
  .day-checkboxes {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px;
  }
  .day-check {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: #2b2822;
    background: #f7f4ec; border: 1px solid #e6e0d2; border-radius: 6px; padding: 6px 8px;
    text-align: left; cursor: pointer;
  }
  .hidden { display: none !important; }
  .list-card { max-width: 460px; text-align: left; }
  .list-table-wrap { max-height: 65vh; overflow-y: auto; margin-top: 10px; border: 1px solid #e6e0d2; border-radius: 8px; }
  .list-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .list-table th {
    position: sticky; top: 0; background: #2f3e28; color: #f5efdc;
    text-align: left; padding: 7px 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    cursor: pointer; user-select: none;
  }
  .sort-arrow { font-size: 9px; opacity: .8; }
  .list-table th:nth-child(2), .list-table th:nth-child(3),
  .list-table td:nth-child(2), .list-table td:nth-child(3) { text-align: center; width: 52px; }
  .list-table td { padding: 6px 8px; border-top: 1px solid #eee9dc; color: #2b2822; cursor: pointer; }
  .list-table tr:hover td { background: #f7f4ec; }
  .list-table td.chord { font-weight: 800; }
  .list-table td.gender-cell { text-align: center; }
  .gender-pill {
    display: inline-block; font-size: 13px; font-weight: 900; color: #fff;
    padding: 2px 9px; border-radius: 5px; line-height: 1.4;
  }
  .gender-pill.male { background: #16213e; }
  .gender-pill.female { background: #8e24aa; }
</style>
</head>
<body>

</div>
<aside>
  <div>
    <div class="brand-title" onclick="goToToday()" title="Click to see today's songs">Guitar Songs</div>
    <div class="brand-sub" id="counter"></div>
  </div>
  <div class="box">
    <div class="box-title">Group days</div>
    <div id="dayChips"></div>
    <div class="mini-row">
      <button class="mini" onclick="setAllDays(true)">All</button>
      <button class="mini" onclick="setAllDays(false)">None</button>
    </div>
  </div>
  <div class="box">
    <div class="box-title">Days layout</div>
    <button class="chip" id="btn-tb" onclick="setLayout('tb')"><span>Go Vertical</span></button>
    <button class="chip" id="btn-lr" onclick="setLayout('lr')"><span>Go Horizontal</span></button>
  </div>
  <div class="box">
    <button class="chip add-song" onclick="openRandomModal()"><span>🎲 Roll the dice</span></button>
  </div>
  <div class="box">
    <div class="box-title">Chord pairs</div>
    <div id="pairChips"></div>
    <div class="hint">None selected = show all chords.</div>
  </div>
  <div class="box">
    <div class="box-row">
      <button class="chip add-song half" onclick="openAddSong()"><span>&#65291; Add New</span></button>
      <button class="chip add-song half" onclick="openFullList()"><span>&#128203; Full List</span></button>
    </div>
  </div>
</aside>
<main>
  <div id="searchBar">
    <input id="searchInput" type="text" placeholder="&#128269; Search by song, chord, or category (Hanoi, Romantic, Trinh Cong Son...)" oninput="onSearchInput(this.value)">
  </div>
  <div id="pickBanner"></div>
  <div id="board"></div>
</main>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-top-row">
      <button class="arrow-btn" id="lastBtn" onclick="lastPick()">&laquo;&laquo; LAST</button>
      <div class="modal-eyebrow" style="margin-bottom:0;">🎲 Random Pick</div>
      <button class="arrow-btn" onclick="nextRandomPick()">NEXT &raquo;&raquo;</button>
    </div>
    <div class="modal-badge-wrap" id="modalBadge"></div>
    <div class="modal-song" id="modalSong"></div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-buttons">
      <button class="modal-btn primary" onclick="stayWithSong()">✅ Stay with this song</button>
      <button class="modal-btn secondary" onclick="tiramisuPick()">🍰 Tiramisu</button>
      <button class="modal-btn ghost" onclick="skipToNormal()">Back to normal</button>
    </div>
  </div>
</div>

<div id="songInfoOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-top-row">
      <div class="modal-eyebrow" style="margin-bottom:0;">Song Info</div>
      <button class="arrow-btn" id="infoEditBtn" onclick="editFromInfo()" title="Edit">✏️</button>
    </div>
    <div class="modal-badge-wrap" id="infoBadge"></div>
    <div class="modal-song" id="infoSong"></div>
    <div class="modal-meta" id="infoMeta"></div>
    <div class="modal-buttons">
      <button class="modal-btn ghost" onclick="closeSongInfo()">Close</button>
    </div>
  </div>
</div>

<div id="fullListOverlay" class="modal-overlay hidden">
  <div class="modal-card list-card">
    <div class="modal-top-row">
      <div class="modal-eyebrow" style="margin-bottom:0;">Full Song List</div>
      <button class="arrow-btn" onclick="closeFullList()">&times; Close</button>
    </div>
    <div class="list-table-wrap">
      <table class="list-table">
        <thead>
          <tr>
            <th onclick="sortFullList('name')" id="th-name">Song <span class="sort-arrow" id="arrow-name"></span></th>
            <th onclick="sortFullList('chord')" id="th-chord">Chord <span class="sort-arrow" id="arrow-chord"></span></th>
            <th onclick="sortFullList('gender')" id="th-gender">&#9792;/&#9794; <span class="sort-arrow" id="arrow-gender"></span></th>
          </tr>
        </thead>
        <tbody id="fullListBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="songFormOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <div id="pwStage">
      <div class="modal-eyebrow">🔒 Enter Password</div>
      <input type="password" id="pwInput" class="text-input" placeholder="Password" onkeydown="if(event.key==='Enter')submitPassword()">
      <div class="form-error" id="pwError"></div>
      <div class="modal-buttons">
        <button class="modal-btn primary" onclick="submitPassword()">Unlock</button>
        <button class="modal-btn ghost" onclick="closeSongForm()">Cancel</button>
      </div>
    </div>
    <div id="formStage" class="hidden">
      <div class="modal-eyebrow" id="formTitle">Add New Song</div>
      <label class="form-label">Song name</label>
      <input type="text" id="songNameInput" class="text-input" placeholder="Song name">
      <label class="form-label">Chord</label>
      <input type="text" id="songChordInput" class="text-input" placeholder="e.g. C, Am, F">
      <label class="form-label" id="dayLabel">Day(s)</label>
      <div id="dayCheckboxes" class="day-checkboxes"></div>
      <label class="form-label">Gender</label>
      <div class="day-checkboxes gender-row">
        <label class="day-check"><input type="checkbox" id="genderMale" onclick="onGenderClick('male')"> &#9794; Male</label>
        <label class="day-check"><input type="checkbox" id="genderFemale" onclick="onGenderClick('female')"> &#9792; Female</label>
      </div>
      <div class="form-error" id="formError"></div>
      <div class="modal-buttons">
        <button class="modal-btn primary" onclick="saveSongForm()">Save</button>
        <button class="modal-btn danger hidden" id="deleteBtn" onclick="deleteSongForm()">Delete song</button>
        <button class="modal-btn ghost" onclick="closeSongForm()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---------- Original spreadsheet, flattened into a simple song list ----------
const GRID = [["Mon", [["NGƯỜI TÌNH MÙA ĐÔNG", "F"], ["LỜI NGƯỜI RA ĐI (TÔI XA HÀ NỘI….)", "F"], ["BẾN CẢNG QUÊ HƯƠNG TÔI", "Em"], ["RIÊNG MỘT GÓC TRỜI", "Dm"], ["HÃY YÊU NHƯ CHƯA YÊU LẦN NÀO", "G"], ["NOW AND FOREVER", "G"], ["TÔI RU EM NGỦ", "C"], ["CÁT BỤI", "Am"]]], ["Tue", [["BẾN THƯỢNG HẢI", "Dm"], ["HÀ NỘI NIỀM TIN VÀ HY VỌNG", "C"], ["GỬI EM Ở CUỐI SÔNG HỒNG", "Em"], ["CON ĐƯỜNG MÀU XANH", "C"], ["VỀ ĐÂY NGHE EM", "C"], ["WONDEFUL TONIGHT", "G"], ["GIỌT SƯƠNG TRÊN MÍ MẮT", "Am"], ["TRỜI CÒN LÀM MƯA, MÂY TRÔI…", "Am"]]], ["Wed", [["CHIÊU NAY TỪNG CƠN GIÓ ĐƯA", "Am"], ["HÀ NỘI MÙA VẮNG NHỮNG CƠN MƯA", "Am"], ["BẠN ƠI HÃY ĐẾN QH….", "C"], ["MƯA HỒNG", "D"], ["NGÀY EM ĐẾN", "D"], ["THE SOUND OF SILENCE", "Em"], ["HOA TÍM NGOÀI SÂN", "C"], ["ĐƯỜNG XƯA", "Am"]]], ["Thu", [["EM YÊU ƠI TÌNH NÀY DÂNG HẾT", "Dm"], ["MÙA THU HÀ NỘI - EM NGHE CHĂNG …", "F"], ["TRƯỜNG SƠN ĐÔNG / TÂY", "Dm"], ["BÂY GIỜ THÁNG MẤY RỒI HỠI EM", "C"], ["LỜI YÊU THƯƠNG", "F"], ["LA PALOMA", "C"], ["GIỌT NẮNG BÊN THỀM", "C"], ["NẮNG ẤM QUÊ HƯƠNG", "Em"]]], ["Fri", [["ÁNH TRĂNG - LÒNG TÔI", "F"], ["HÀ NỘI MÙA THU (CÂY CƠM NGUỘI ...)", "F"], ["CÔ GÁI MỞ ĐƯỜNG", "Em"], ["VÀ CON TIM ĐÃ VUI TRỞ LẠI", "C"], ["ĐƯỜNG XA ƯỚT MƯA", "F"], ["YESTERDAY", "F"], ["TÀ ÁO EM", "C"], ["XUÂN NÀY CON KHÔNG VỀ", "F"]]], ["Sat", [["CHUYỆN TÌNH TA TAN VỠ ÔI TỪ ĐÂY", "C"], ["THÁNG TÁM MÙA THU - LÁ RƠI VÀNG …", "G"], ["NỔI LỬA LÊN EM", "C"], ["NẮNG THỦY TINH", "C"], ["YÊU EM DÀI LÂU", "A"], ["LET IT BE", "C"], ["MƯA NGÂU", "C"], ["VỀ QUÊ (THƯƠNG EM…)", "Em"]]], ["Sun", [["NGƯỜI TỪ TRIỀU CHÂU", "C"], ["HÀ NỘI ĐÊM TRỞ GIÓ", "C"], ["NẮNG ÂM QUÊ HƯƠNG", "Em"], ["CÂY ĐÀN BỎ QUÊN", "Dm"], ["EM BÊN MÌNH ANH ...", "C"], ["MY WAY", "C"], ["LỐI CŨ TA VỀ", "G"], ["CẮT NỬA VẦNG TRĂNG", "Am"]]], ["Mon", [["NHỚ VỀ EM (NGỒI NHÌN MÂY TRÔI..)", "Dm"], ["EM ƠI HÀ NỘI PHỐ", "Dm"], ["MÙA XUÂN QUÊ HƯƠNG", "Em"], ["TRẢ LẠI EM YÊU KHUNG TRỜI…", "G"], ["TỪNG TRANG NHẬT KÝ MỞ RA (ĐB)", "F"], ["TOP OF THE WORLD", "G"], ["EM ĐI GIỮA BIỂN VẢNG", "G"], ["BÊN BỜ HIỀN LƯƠNG", "C"]]], ["Tue", [["NGƯỜI RA ĐI, ĐỂ SẦU ÚA LÊN TRĂNG..", "Am"], ["PHỐ BIỂN (THANH TÙNG)", "C"], ["HUYỀN THOẠI MẸ (ĐÊM TRONG..)", "Am"], ["YÊU EM YÊU EM NGHE ANH….", "F"], ["CƠN MƯA TÌNH YÊU", "C"], ["HELLO", "Am"], ["AI CÓ VỀ BÊN BẾN SÔNG TƯƠNG", "C"], ["CHIM SÁO NGÀY XƯA", "F"]]], ["Wed", [["BUÔC VÀO CƠN GIÓ", "Am"], ["TRƯA VẮNG (MỸ LINH)", "C"], ["NGƯỜI ƠI NGƯỜI Ở ĐỪNG VỀ", "G"], ["QUA BẾN NƯỚC XƯA…", "C"], ["MÙA THU CHO EM (EM CÓ NGHE..)", "G"], ["WONDEFUL WORLD", "F"], ["TÔI ĐƯA EM SANG SÔNG", "Dm"], ["DƯ ÂM", "G"]]], ["Thu", [null, ["BIỂN CẠN", "Dm"], ["BÈO DẠT MÂY TRÔI", "G"], ["HÃY LẠI GẦN VỚI EM...", "C"], ["NGƯỜI VỀ ĐÂY VỚI EM (MỸ TÂM)", "C"], ["OP LA DI - OP LA DA", "G"], ["KHOẢNH KHẮC (CHỈ CÒN 1 CH. LÁ)", "G"], ["GÓT HỒNG", "G"]]], ["Fri", [["HAPPY NEW YEAR", "C"], ["CHIỀU NAY KHÔNG CÓ EM (CHIỀU NAY)", "F"], ["RU CON (RU HỜI, HỜI RU..)", "C"], ["MỘT ĐÊM SAY", "G"], ["ƯỚC GÌ", "G"], ["SWAY", "Am"], ["THÔI EM HÃY VỀ", "C"], ["RỒI MAI TÔI ĐƯA EM", "F"]]], ["Sat", [["JINGLE BELL", "C"], ["NHÌN NHỮNG MÙA THU ĐI (TCS)", "C"], ["MƯA TRÊN PHỐ HUẾ", "C"], ["BUỒN ƠI TA XIN CHÀO MI", "F"], ["TRÁI TIM KHÔNG NGỦ YÊN", "F"], ["NOTHING GONNA CHANGE MY LOVE", "C"], ["ĐỜI SINH VIÊN CÓ CÂY ĐÀN GUITAR", "Am"], ["DƯỜNG NHƯ AI ĐI NGANG CỬA", "Am"]]], ["Sun", [["WE WISH YOU A MERRY XMAS", "C"], ["BIỂN NHỚ (TRỊNH CÔNG SƠN)", "Am"], ["CHIỀU NAY LỐI VỀ ĐẤT MẸ…", "C"], ["MẮT BIẾC", "D"], ["10 NĂM TÌNH CŨ", "Am"], ["FLY ME TO THE MOON", "Dm"], ["HƯƠNG NGỌC LAN", "C"], ["KHÔNG CÒN MÙA THU…", "C"]]], ["Mon", [["FELIZ NAVIDAZ", "C"], ["NHỚ VỀ HÀ NỘI", "A"], ["TÌNH CA TÂY BẮC", "G"], ["BÊN EM LÀ BIỂN RỘNG", "Am"], ["PHỐ XA", "Am"], ["VIEN M'EMBRASER (LAI GAN HON A)", "Am"], ["GIẤC MƠ CÓ THẬT", "C"], ["NGÀY VỀ (TUNG CÁNH CHIM…)", "G"]]], ["Tue", [["SILENT NIGHT", "C"], ["LÀNG LÚA LÀNG HOA MÙA XUÂN", "Am"], ["LONG PHỤNG XUM VẦY", "F"], ["THÌ THẦM MÙA XUÂN (N.CHÂU)", "Em"], ["XUÂN VÀ TUỔI TRẺ", "C"], ["IT'S NOW OR NEVER", "F"], ["NĂM QUA ĐÃ LÀM GÌ", "C"], ["ĐÓN XUÂN (XUÂN ĐÃ ĐẾN RỒI)", "C"]]], ["Wed", [null, null, null, ["EM VỀ TINH KHÔI (B. KIỀU)", "G"], ["VÀ TÔI CŨNG YÊU EM", "C"], null, ["LÀNG LÚA LÀNG HOA", "Am"], ["ĐOẢN XUÂN CA (NGHE XUÂN SANG)", "C"]]]];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun","Fun"];
const DAY_CAT = {
  Mon:"Chinese / Festive", Tue:"Hanoi / Biển / Trinh Cong Son", Wed:"War Songs / Folks",
  Thu:"Romantic", Fri:"Romantic2", Sat:"English", Sun:"Thanh Tùng / Misc", Fun:"Misc"
};
const PAIRS = [
  { id:"CAm", label:"C – Am – A", chords:["C","Am","A"] },
  { id:"DBm", label:"D – Bm", chords:["D","Bm"] },
  { id:"EmG", label:"Em – G", chords:["Em","G"] },
  { id:"FDm", label:"F – Dm", chords:["F","Dm"] },
];
const pairOf = c => PAIRS.find(p => p.chords.includes(c));

function flattenGrid(grid){
  const out = []; let n = 0;
  grid.forEach(row => {
    row[1].forEach((c, colIdx) => {
      if (c) out.push({ id: "s" + (n++), name: c[0], chord: c[1], day: DAYS[colIdx] });
    });
  });
  return out;
}
const DEFAULT_SONGS = flattenGrid(GRID);
const SONGS_KEY = "gsb_songs_v1";
const PLAYS_KEY = "gsb_playcounts_v1";
const PASSWORD = "jjj";

function loadSongs(){
  try {
    const raw = localStorage.getItem(SONGS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  localStorage.setItem(SONGS_KEY, JSON.stringify(DEFAULT_SONGS));
  return DEFAULT_SONGS.slice();
}
function saveSongs(){ try { localStorage.setItem(SONGS_KEY, JSON.stringify(songs)); } catch(e) {} }
function loadPlays(){
  try { const raw = localStorage.getItem(PLAYS_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return {};
}
function savePlays(){ try { localStorage.setItem(PLAYS_KEY, JSON.stringify(playCounts)); } catch(e) {} }

let songs = loadSongs();
let playCounts = loadPlays();
let activeDays = new Set(DAYS);
let activePairs = new Set();
let layout = "lr";
let pinnedPick = null;
let searchQuery = "";

let pickHistory = [];
let historyIndex = -1;

function pickRandomSong(excludeId){
  let pool = songs;
  if (excludeId && pool.length > 1) pool = pool.filter(s => s.id !== excludeId);
  if (pool.length === 0) pool = songs;
  return pool[Math.floor(Math.random() * pool.length)];
}
function pickLeastPopped(excludeId){
  let pool = songs.slice();
  if (excludeId && pool.length > 1) pool = pool.filter(s => s.id !== excludeId);
  if (pool.length === 0) pool = songs.slice();
  const min = Math.min(...pool.map(s => playCounts[s.id] || 0));
  const candidates = pool.filter(s => (playCounts[s.id] || 0) === min);
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function currentSong(){ return pickHistory[historyIndex]; }

function renderModal(){
  const s = currentSong();
  document.getElementById("modalBadge").innerHTML = badge(s.chord) + genderMark(s.gender);
  document.getElementById("modalSong").textContent = s.name;
  document.getElementById("modalMeta").textContent = "Day: " + s.day;
  document.getElementById("lastBtn").disabled = historyIndex <= 0;
}
function pushPick(song){
  pickHistory.push(song);
  historyIndex = pickHistory.length - 1;
  playCounts[song.id] = (playCounts[song.id] || 0) + 1;
  savePlays();
  renderModal();
}
function openRandomModal(){
  pickHistory = []; historyIndex = -1;
  pushPick(pickRandomSong());
  document.getElementById("modalOverlay").classList.remove("hidden");
}
function nextRandomPick(){
  if (historyIndex < pickHistory.length - 1) { historyIndex++; renderModal(); }
  else { pushPick(pickRandomSong(currentSong().id)); }
}
function lastPick(){
  if (historyIndex > 0) { historyIndex--; renderModal(); }
}
function tiramisuPick(){
  pushPick(pickLeastPopped(currentSong().id));
}
function closeModal(){ document.getElementById("modalOverlay").classList.add("hidden"); }
function goToToday(){
  const map = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  activeDays = new Set([map[new Date().getDay()]]);
  layout = "lr";
  render();
}
function stayWithSong(){ pinnedPick = currentSong(); closeModal(); goToToday(); }
function skipToNormal(){ pinnedPick = null; closeModal(); goToToday(); }
function clearPin(){ pinnedPick = null; render(); }

function setAllDays(on){ activeDays = on ? new Set(DAYS) : new Set(); render(); }
function toggleDay(d){ activeDays.has(d) ? activeDays.delete(d) : activeDays.add(d); render(); }
function togglePair(id){ activePairs.has(id) ? activePairs.delete(id) : activePairs.add(id); render(); }
function setLayout(l){ layout = l; render(); }
function onSearchInput(v){ searchQuery = v; render(); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function chordOK(c){
  if (activePairs.size === 0) return true;
  const p = pairOf(c);
  return p ? activePairs.has(p.id) : false;
}
function badge(c){
  const p = pairOf(c);
  return `<span class="badge ${p ? "p-" + p.id : ""}">${esc(c)}</span>`;
}
function genderMark(g){
  if (g === "male") return `<span class="gender-mark male">&#9794;</span>`;
  if (g === "female") return `<span class="gender-mark female">&#9792;</span>`;
  return "";
}

function render(){
  document.getElementById("dayChips").innerHTML = DAYS.map(d => {
    const label = d === "Fun" ? "Fun ♪" : d;
    const cnt = songs.filter(s => s.day === d).length;
    return `<button class="chip ${activeDays.has(d) ? "on" : ""}" onclick="toggleDay('${d}')">
      <span>${label}</span><span class="cnt">${cnt}</span></button>`;
  }).join("");

  document.getElementById("pairChips").innerHTML = PAIRS.map(p => {
    const n = songs.filter(s => p.chords.includes(s.chord)).length;
    return `<button class="chip pair p-${p.id} ${activePairs.has(p.id) ? "on" : ""}" onclick="togglePair('${p.id}')">
      <span>${p.label}</span><span class="cnt">${n}</span></button>`;
  }).join("");

  document.getElementById("btn-lr").className = "chip" + (layout === "lr" ? " on" : "");
  document.getElementById("btn-tb").className = "chip" + (layout === "tb" ? " on" : "");

  const bannerEl = document.getElementById("pickBanner");
  bannerEl.innerHTML = pinnedPick
    ? `<div class="pick-banner">🎵 Your pick: <strong>${esc(pinnedPick.name)}</strong> (${esc(pinnedPick.chord)}) &middot; ${pinnedPick.day}
        <button onclick="clearPin()">clear</button></div>`
    : "";

  const board = document.getElementById("board");
  board.className = layout;
  const visible = DAYS.filter(d => activeDays.has(d));
  if (visible.length === 0) {
    board.innerHTML = `<div class="no-days">No days selected. Pick days in the sidebar to see songs.</div>`;
    document.getElementById("counter").textContent = "0 of " + songs.length + " songs shown";
    return;
  }

  let shown = 0;
  board.innerHTML = visible.map(d => {
    const q = searchQuery.trim().toLowerCase();
    const catMatch = q && (DAY_CAT[d] || "").toLowerCase().includes(q);
    const list = songs.filter(s => s.day === d && (!q || catMatch || s.name.toLowerCase().includes(q) || s.chord.toLowerCase().includes(q)));
    let bodyHTML, count = 0;

    if (layout === "lr") {
      const cells = list.map(s => {
        const ok = chordOK(s.chord);
        if (ok) count++;
        return `<span class="cell${ok ? "" : " dim"}" data-id="${s.id}" onclick="openSongInfo('${s.id}')"><span class="name">${esc(s.name)}</span>${badge(s.chord)}${genderMark(s.gender)}</span>`;
      }).join("");
      bodyHTML = `<div class="line"><div class="line-songs">${cells || `<div class="empty">—</div>`}</div></div>`;
    } else {
      const rows = list.filter(s => chordOK(s.chord));
      count = rows.length;
      bodyHTML = rows.length === 0
        ? `<div class="empty">No songs match the chord filter.</div>`
        : rows.map(s => `<div class="song" data-id="${s.id}" onclick="openSongInfo('${s.id}')"><span class="name">${esc(s.name)}</span><span class="chord-col">${badge(s.chord)}</span><span class="gender-col">${genderMark(s.gender)}</span></div>`).join("");
    }

    shown += count;
    const sub = (DAY_CAT[d] || "") + " · " + count + " songs";
    return `<div class="day-card">
      <div class="day-head ${d === "Fun" ? "fun" : ""}">
        <div class="day-name">${d}</div>
        <div class="day-sub">${sub}</div>
      </div>
      <div class="day-body">${bodyHTML}</div>
    </div>`;
  }).join("");

  document.getElementById("counter").textContent = shown + " of " + songs.length + " songs shown";

  if (pinnedPick) {
    const el = document.querySelector(`[data-id="${pinnedPick.id}"]`);
    if (el) {
      el.classList.add("picked");
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
}

// ---------- Full song list (A–Z, sortable) ----------
let listSort = { col: "name", dir: 1 };

function openFullList(){
  listSort = { col: "name", dir: 1 };
  renderFullList();
  document.getElementById("fullListOverlay").classList.remove("hidden");
}
function sortFullList(col){
  if (listSort.col === col) listSort.dir *= -1;
  else listSort = { col, dir: 1 };
  renderFullList();
}
function renderFullList(){
  const { col, dir } = listSort;
  const val = s => (s[col] || "").toString();
  const sorted = songs.slice().sort((a,b) => val(a).localeCompare(val(b), "vi") * dir);

  ["name","chord","gender"].forEach(c => {
    const arrow = document.getElementById("arrow-" + c);
    arrow.textContent = c === col ? (dir === 1 ? "▲" : "▼") : "";
  });

  document.getElementById("fullListBody").innerHTML = sorted.map(s => `
    <tr onclick="closeFullList(); openSongInfo('${s.id}')">
      <td>${esc(s.name)}</td>
      <td class="chord">${esc(s.chord)}</td>
      <td class="gender-cell">${s.gender === "male" ? `<span class="gender-pill male">&#9794;</span>` : s.gender === "female" ? `<span class="gender-pill female">&#9792;</span>` : "—"}</td>
    </tr>`).join("");
}
function closeFullList(){
  document.getElementById("fullListOverlay").classList.add("hidden");
}

// ---------- Song info (read-only, no password) ----------
let infoSongId = null;

function openSongInfo(id){
  const s = songs.find(x => x.id === id);
  if (!s) return;
  infoSongId = id;
  document.getElementById("infoBadge").innerHTML = badge(s.chord) + genderMark(s.gender);
  document.getElementById("infoSong").textContent = s.name;
  document.getElementById("infoMeta").textContent = "Day: " + s.day;
  document.getElementById("songInfoOverlay").classList.remove("hidden");
}
function closeSongInfo(){
  document.getElementById("songInfoOverlay").classList.add("hidden");
}
function editFromInfo(){
  const id = infoSongId;
  closeSongInfo();
  if (id) openEditSong(id);
}

// ---------- Add / edit song (password-gated) ----------
let songFormMode = "add"; // "add" | "edit"
let songFormEditId = null;
let songFormUnlocked = false;
let songFormPrefill = null;

function renderDayCheckboxes(multi, selectedDays){
  document.getElementById("dayCheckboxes").innerHTML = DAYS.map(d => {
    const label = d === "Fun" ? "Anytimes" : d;
    const checked = selectedDays.includes(d) ? "checked" : "";
    const type = multi ? "checkbox" : "radio";
    return `<label class="day-check"><input type="${type}" name="dayPick" value="${d}" ${checked}> ${label}</label>`;
  }).join("");
}

function onGenderClick(which){
  const male = document.getElementById("genderMale");
  const female = document.getElementById("genderFemale");
  if (which === "male" && male.checked) female.checked = false;
  if (which === "female" && female.checked) male.checked = false;
}
function setGenderCheckboxes(gender){
  document.getElementById("genderMale").checked = gender === "male";
  document.getElementById("genderFemale").checked = gender === "female";
}
function readGenderCheckboxes(){
  if (document.getElementById("genderMale").checked) return "male";
  if (document.getElementById("genderFemale").checked) return "female";
  return "";
}

function openAddSong(){
  songFormMode = "add"; songFormEditId = null; songFormUnlocked = false; songFormPrefill = null;
  document.getElementById("pwStage").classList.remove("hidden");
  document.getElementById("formStage").classList.add("hidden");
  document.getElementById("pwInput").value = "";
  document.getElementById("pwError").textContent = "";
  document.getElementById("formTitle").textContent = "Add New Song";
  document.getElementById("deleteBtn").classList.add("hidden");
  document.getElementById("dayLabel").textContent = "Day(s)";
  renderDayCheckboxes(true, []);
  document.getElementById("songFormOverlay").classList.remove("hidden");
  setTimeout(() => document.getElementById("pwInput").focus(), 50);
}

function openEditSong(id){
  const s = songs.find(x => x.id === id);
  if (!s) return;
  songFormMode = "edit"; songFormEditId = id; songFormUnlocked = false;
  songFormPrefill = { name: s.name, chord: s.chord, gender: s.gender || "" };
  document.getElementById("pwStage").classList.remove("hidden");
  document.getElementById("formStage").classList.add("hidden");
  document.getElementById("pwInput").value = "";
  document.getElementById("pwError").textContent = "";
  document.getElementById("formTitle").textContent = "Edit Song";
  document.getElementById("deleteBtn").classList.remove("hidden");
  document.getElementById("dayLabel").textContent = "Day";
  renderDayCheckboxes(false, [s.day]);
  document.getElementById("songFormOverlay").classList.remove("hidden");
  setTimeout(() => document.getElementById("pwInput").focus(), 50);
}

function submitPassword(){
  const val = document.getElementById("pwInput").value;
  if (val !== PASSWORD) {
    document.getElementById("pwError").textContent = "Wrong password.";
    document.getElementById("pwInput").value = "";
    document.getElementById("pwInput").focus();
    return;
  }
  songFormUnlocked = true;
  document.getElementById("pwStage").classList.add("hidden");
  document.getElementById("formStage").classList.remove("hidden");
  document.getElementById("formError").textContent = "";
  if (songFormMode === "add") {
    document.getElementById("songNameInput").value = "";
    document.getElementById("songChordInput").value = "";
    setGenderCheckboxes("");
  } else if (songFormPrefill) {
    document.getElementById("songNameInput").value = songFormPrefill.name;
    document.getElementById("songChordInput").value = songFormPrefill.chord;
    setGenderCheckboxes(songFormPrefill.gender);
  }
}

function closeSongForm(){
  document.getElementById("songFormOverlay").classList.add("hidden");
}

function saveSongForm(){
  if (!songFormUnlocked) return;
  const name = document.getElementById("songNameInput").value.trim();
  const chord = document.getElementById("songChordInput").value.trim();
  const checkedDays = Array.from(document.querySelectorAll("#dayCheckboxes input:checked")).map(i => i.value);
  const gender = readGenderCheckboxes();
  if (!name) { document.getElementById("formError").textContent = "Song name is required."; return; }
  if (!chord) { document.getElementById("formError").textContent = "Chord is required."; return; }
  if (checkedDays.length === 0) { document.getElementById("formError").textContent = "Pick at least one day."; return; }

  if (songFormMode === "add") {
    checkedDays.forEach(d => {
      songs.push({ id: "s" + Date.now() + Math.random().toString(36).slice(2,7), name, chord, day: d, gender });
    });
  } else {
    const s = songs.find(x => x.id === songFormEditId);
    if (s) { s.name = name; s.chord = chord; s.day = checkedDays[0]; s.gender = gender; }
  }
  saveSongs();
  closeSongForm();
  render();
}

function deleteSongForm(){
  if (!songFormUnlocked || songFormMode !== "edit") return;
  songs = songs.filter(x => x.id !== songFormEditId);
  saveSongs();
  closeSongForm();
  render();
}

render();
openRandomModal();
</script>
</body>
</html>
